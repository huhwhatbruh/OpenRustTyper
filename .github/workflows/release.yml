name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  archpkg:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            rust namcap sudo pacman-contrib \
            libglvnd libx11 libxkbcommon wayland

      # makepkg refuses to run as root, so give it an unprivileged user.
      - name: Build
        run: |
          useradd -m builder
          cp packaging/PKGBUILD packaging/openautotyper.install /home/builder/
          chown -R builder:builder /home/builder
          # The PKGBUILD ships sha256sums=('SKIP'); pin it to the tarball this
          # release actually published before anything is built from it.
          sudo -u builder bash -lc 'cd ~ && updpkgsums && makepkg --noconfirm'

      - name: Lint the built package
        run: sudo -u builder bash -lc 'cd ~ && namcap PKGBUILD *.pkg.tar.zst' || true

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAutoTyper-arch
          path: /home/builder/*.pkg.tar.zst

  binaries:
    name: Linux binaries
    # Built on the oldest distro still supported so the glibc it links against
    # is old enough to run everywhere newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release

      - name: Package
        run: |
          mkdir -p dist/openautotyper
          cp target/release/openautotyper target/release/openautotyper-gui dist/openautotyper/
          cp -r packaging LICENSE README.md dist/openautotyper/
          tar -C dist -czf dist/openautotyper-linux-x86_64.tar.gz openautotyper

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAutoTyper-linux
          path: dist/openautotyper-linux-x86_64.tar.gz
