name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  wheel:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  archpkg:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            python-build python-installer python-hatchling python-wheel \
            python-pytest python-evdev namcap sudo pacman-contrib

      # makepkg refuses to run as root, so give it an unprivileged user.
      - name: Build
        run: |
          useradd -m builder
          cp packaging/PKGBUILD packaging/openautotyper.install /home/builder/
          chown -R builder:builder /home/builder
          # The PKGBUILD ships sha256sums=('SKIP'); pin it to the tarball this
          # release actually published before anything is built from it.
          sudo -u builder bash -lc 'cd ~ && updpkgsums && makepkg --noconfirm'

      - name: Lint the built package
        run: sudo -u builder bash -lc 'cd ~ && namcap PKGBUILD *.pkg.tar.zst' || true

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAutoTyper-arch
          path: /home/builder/*.pkg.tar.zst

  executable:
    name: Standalone binary
    # Built on the oldest distro still supported so the glibc it links against
    # is old enough to run everywhere newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libegl1 libgl1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pyinstaller

      - name: Build
        run: >
          pyinstaller --onefile --console --name openautotyper
          --collect-submodules openautotyper
          openautotyper/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAutoTyper-linux
          path: dist/
