name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
        include:
          - os: ubuntu-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt needs an X server and a handful of system libraries even to run
      # offscreen; without them the GUI tests skip silently and stop guarding
      # anything.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"

      - name: Lint
        run: ruff check openautotyper tests

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      # The engine must not quietly start depending on Qt or evdev: the CLI is
      # supposed to run on a bare machine.
      - name: Import engine without optional extras
        run: |
          python -c "
          import openautotyper.timing, openautotyper.text, openautotyper.clock
          import openautotyper.cli
          print('engine imports with stdlib only')
          "

      - name: CLI smoke test
        run: |
          python -m openautotyper --list-backends
          python -m openautotyper --doctor || true
          echo "round trip" | python -m openautotyper --dry-run -q
