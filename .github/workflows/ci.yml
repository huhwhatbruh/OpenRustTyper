name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Linux only, because the program is: typing through /dev/uinput is the
    # whole of what it does.
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The window opens these when it starts rather than linking them, and the
      # keymap tests compile the real layout through libxkbcommon; without it
      # they would quietly test the built-in fallback instead.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libx11-6 \
            libegl1 libgl1 desktop-file-utils

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The engine must not quietly start depending on the window: the command
      # line is supposed to build and run without any of it.
      - name: Command line builds without the window
        run: cargo build --locked --no-default-features

      - name: CLI smoke test
        run: |
          cargo run --locked --no-default-features -q -- --list-backends
          cargo run --locked --no-default-features -q -- --doctor || true
          echo "round trip" | cargo run --locked --no-default-features -q -- --dry-run -q
