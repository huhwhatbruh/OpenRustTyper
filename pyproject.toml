[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openautotyper"
version = "2.0.0"
description = "Type text into the focused window as real keystrokes, at a cadence you control."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "huhwhatbruh" }]
keywords = ["keyboard", "automation", "typing", "accessibility", "uinput", "wayland"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

# The engine, the CLI and every backend on Windows and macOS run on the
# standard library alone. Linux needs evdev to open /dev/uinput; the GUI is
# the only genuinely optional extra.
dependencies = ["evdev>=1.6; sys_platform == 'linux'"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
openautotyper = "openautotyper.cli:main"

[project.gui-scripts]
openautotyper-gui = "openautotyper.gui:run_gui"

[project.urls]
Homepage = "https://github.com/huhwhatbruh/OpenAutoTyper"
Issues = "https://github.com/huhwhatbruh/OpenAutoTyper/issues"

[tool.hatch.build.targets.wheel]
packages = ["openautotyper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Folding confusable characters is what this module is for, and the word list
# is far more readable as prose than as a hundred-element literal.
"openautotyper/text.py" = ["RUF001", "RUF002", "RUF003"]
"openautotyper/timing.py" = ["SIM905"]
"tests/test_text.py" = ["RUF001", "RUF002"]
"tests/*" = ["B011"]
